set timeout=-1
set default=0
set pager=0
insmod efi_gop
insmod gfxterm
loadfont (memdisk)/boot/ascii.pf2
set gfxmode=1920x1080,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta
echo "GrapeLoad UEFI - Press Enter to boot GrapeOS"
menuentry "GrapeLoad / GrapeOS (UEFI)" {
    echo "[ OK ] GrapeOS selected"
    echo "[ .. ] Loading GrapeOS kernel..."
    multiboot2 (memdisk)/boot/grapeos.elf
    boot
}
